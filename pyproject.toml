[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudonymisation-gateway"
version = "0.3.0"
description = "Jurisdiction-aware PII pseudonymisation middleware for legal-tech tools using cloud LLMs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rushikesh R. Mahajan (publishing as wolfgang_rush)", email = "advrushikeshravindramahajan@gmail.com"}]
keywords = ["pseudonymisation", "anonymisation", "pii", "gdpr", "dpdp", "legal-tech", "privacy", "ai", "llm", "law"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5.0"]
ner = ["spacy>=3.7"]

[project.urls]
Homepage = "https://github.com/Wolfgangrush/pseudonymisation-gateway"
Repository = "https://github.com/Wolfgangrush/pseudonymisation-gateway"
Issues = "https://github.com/Wolfgangrush/pseudonymisation-gateway/issues"
"Used By (AI Law Firms)" = "https://github.com/Wolfgangrush"

[tool.setuptools.packages.find]
where = ["."]
include = ["pseudonymisation_gateway*"]
